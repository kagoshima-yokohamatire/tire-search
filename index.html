<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>タイヤ価格検索 2026年6月</title>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f2f5;
  --card:#ffffff;
  --accent:#c0392b;
  --accent2:#e74c3c;
  --navy:#1a252f;
  --text:#2c3e50;
  --muted:#7f8c8d;
  --border:#dde1e7;
  --new-price:#c0392b;
  --old-price:#95a5a6;
  --hobby-bg:#fff3cd;
  --hobby-fg:#856404;
  --stock-bg:#fde8e8;
  --stock-fg:#c0392b;
  --row-hover:#f8f9fa;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'BIZ UDPGothic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px;}

/* HEADER */
header{
  background:var(--navy);
  padding:0 20px;
  display:flex;align-items:center;gap:14px;
  border-bottom:3px solid var(--accent);
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,.3);
}
.header-inner{display:flex;align-items:center;gap:14px;padding:12px 0;width:100%;}
.yoko-logo{
  height:44px;width:auto;object-fit:contain;
  border-radius:4px;flex-shrink:0;
}
header h1{
  font-family:'Oswald',sans-serif;
  font-size:20px;font-weight:600;color:#fff;
  letter-spacing:.04em;line-height:1;
}
header .sub{font-size:11px;color:#aab7c4;margin-top:3px;}
.header-right{margin-left:auto;text-align:right;}
.date-tag{
  font-size:10px;color:#7fb3d3;
  background:rgba(255,255,255,.08);
  padding:3px 8px;border-radius:3px;
  border:1px solid rgba(255,255,255,.12);
}
.pdf-btn{
  display:inline-block;
  background:rgba(255,255,255,.12);
  color:#fff;
  border:1px solid rgba(255,255,255,.3);
  border-radius:5px;
  padding:5px 12px;
  font-size:12px;
  font-family:'BIZ UDPGothic',sans-serif;
  font-weight:700;
  text-decoration:none;
  white-space:nowrap;
  transition:background .15s,border-color .15s;
}
.pdf-btn:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5);}
@media(max-width:600px){
  .pdf-btn{font-size:11px;padding:4px 9px;}
}

/* LAYOUT */
.container{max-width:1400px;margin:0 auto;padding:16px;}

/* FILTER PANEL */
.filter-panel{
  background:var(--card);
  border-radius:8px;
  padding:18px 20px;
  margin-bottom:14px;
  box-shadow:0 1px 4px rgba(0,0,0,.07);
  border:1px solid var(--border);
}
.fp-title{
  font-family:'Oswald',sans-serif;
  font-size:12px;font-weight:600;color:var(--accent);
  letter-spacing:.1em;text-transform:uppercase;
  margin-bottom:14px;
  display:flex;align-items:center;gap:6px;
}
.fp-title::before{content:'';width:3px;height:14px;background:var(--accent);border-radius:2px;display:block;}

.filters{display:flex;flex-direction:column;gap:10px;}
.filter-row1{display:flex;align-items:flex-end;gap:10px;}
.filter-row2{display:flex;align-items:flex-end;gap:10px;}
.filter-row1 .fg{flex:1;}
.filter-row2 .fg{flex:1;}
.filter-row2 .fg.btn-fg{flex:0 0 auto;}

.fg{display:flex;flex-direction:column;gap:5px;}
.fg label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;}
select{
  background:#f8f9fa;
  border:1.5px solid var(--border);
  border-radius:6px;
  color:var(--text);
  font-family:'BIZ UDPGothic',sans-serif;
  font-size:13px;
  padding:8px 10px;
  width:100%;
  outline:none;
  -webkit-appearance:none;appearance:none;
  cursor:pointer;
  transition:border-color .15s,box-shadow .15s;
}
select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(192,57,43,.12);}

.btn-group{display:flex;gap:8px;}
.btn-search{
  background:var(--accent);color:#fff;
  border:none;border-radius:6px;
  font-family:'BIZ UDPGothic',sans-serif;
  font-size:14px;font-weight:700;
  padding:9px 22px;cursor:pointer;
  transition:background .15s,transform .1s;
  white-space:nowrap;
}
.btn-search:hover{background:var(--accent2);}
.btn-search:active{transform:scale(.97);}
.btn-reset{
  background:transparent;color:var(--muted);
  border:1.5px solid var(--border);border-radius:6px;
  font-family:'BIZ UDPGothic',sans-serif;font-size:13px;
  padding:9px 14px;cursor:pointer;
  transition:border-color .15s,color .15s;
  white-space:nowrap;
}
.btn-reset:hover{border-color:var(--muted);color:var(--text);}

/* RESULTS HEADER */
.results-meta{
  display:flex;align-items:center;flex-wrap:wrap;gap:10px;
  margin-bottom:10px;
}
.result-count{font-size:13px;color:var(--muted);}
.result-count strong{color:var(--navy);font-size:17px;font-weight:700;}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);align-items:center;flex-wrap:wrap;}
.badge-h{display:inline-block;background:var(--hobby-bg);color:var(--hobby-fg);border:1px solid #e0c060;border-radius:3px;padding:1px 6px;font-size:10px;font-weight:700;}
.badge-s{display:inline-block;background:var(--stock-bg);color:var(--stock-fg);border:1px solid #f0aaaa;border-radius:3px;padding:1px 6px;font-size:10px;font-weight:700;}

/* TABLE */
.table-wrap{
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;min-width:820px;border-collapse:collapse;}
thead{background:#f8f9fa;border-bottom:2px solid var(--border);}
th{
  font-size:11px;font-weight:700;color:var(--muted);
  padding:10px 14px;text-align:left;
  white-space:nowrap;cursor:pointer;
  user-select:none;letter-spacing:.05em;text-transform:uppercase;
  transition:color .12s;
}
th:hover{color:var(--text);}
th.sort-asc::after{content:' ↑';color:var(--accent);}
th.sort-desc::after{content:' ↓';color:var(--accent);}
th.sticky-col{position:sticky;left:0;z-index:2;background:#f8f9fa;box-shadow:2px 0 5px rgba(0,0,0,.06);}

tbody tr{border-bottom:1px solid #f0f2f5;transition:background .1s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--row-hover);}
tbody tr:hover td.sticky-col{background:#f0f4f8;}

td{padding:9px 14px;font-size:13px;vertical-align:middle;}
td.sticky-col{
  position:sticky;left:0;z-index:1;
  background:var(--card);box-shadow:2px 0 5px rgba(0,0,0,.06);
  font-weight:700;font-size:15px;min-width:150px;max-width:200px;
  word-break:break-word;
  line-height:1.3;
}
td.size-cell{font-family:'Courier New',monospace;font-size:14px;font-weight:700;color:var(--navy);white-space:nowrap;}
td.art-cell{font-family:'Courier New',monospace;font-size:13px;font-weight:700;color:var(--navy);}
td.price-new{
  font-size:16px;font-weight:700;color:var(--new-price);
  white-space:nowrap;
}
td.price-old{color:var(--old-price);font-size:13px;text-decoration:line-through;white-space:nowrap;}
td.price-new-only{font-size:16px;font-weight:700;color:var(--navy);white-space:nowrap;}

.price-diff{
  display:inline-block;
  font-size:10px;font-weight:700;
  padding:1px 5px;border-radius:3px;
  margin-left:5px;vertical-align:middle;
}
.diff-up{background:#fde8e8;color:var(--accent);}
.diff-down{background:#eafaf1;color:#196f3d;}
.diff-same{background:#f0f0f0;color:#888;}

.hobby-row{background:#fffdf0;}
.hobby-row:hover{background:#fff8d6;}
.stock-row td.size-cell::after{
  content:'在庫限';
  margin-left:6px;
  font-size:9px;
  background:var(--stock-bg);color:var(--stock-fg);
  padding:1px 4px;border-radius:2px;border:1px solid #f0aaaa;
  font-family:'BIZ UDPGothic',sans-serif;
  font-weight:700;
}
.flag-h{
  display:inline-block;
  background:var(--hobby-bg);color:var(--hobby-fg);
  border:1px solid #e0c060;border-radius:3px;
  padding:1px 5px;font-size:10px;font-weight:700;
  white-space:nowrap;
}
.flag-s{
  display:inline-block;
  background:var(--stock-bg);color:var(--stock-fg);
  border:1px solid #f0aaaa;border-radius:3px;
  padding:1px 5px;font-size:10px;font-weight:700;
  white-space:nowrap;
}
.flag-new{
  display:inline-block;
  background:#e8f4fd;color:#1a6fa8;
  border:1px solid #acd6f0;border-radius:3px;
  padding:1px 5px;font-size:10px;font-weight:700;
  white-space:nowrap;
}

.no-results{text-align:center;padding:60px 20px;color:var(--muted);}
.no-results .ico{font-size:40px;margin-bottom:14px;opacity:.35;}

/* PAGINATION */
.pagination{
  display:flex;align-items:center;justify-content:center;
  gap:5px;padding:14px;border-top:1px solid var(--border);
  flex-wrap:wrap;
}
.pg-btn{
  background:#f8f9fa;border:1.5px solid var(--border);
  color:var(--text);border-radius:5px;
  padding:5px 11px;font-size:13px;cursor:pointer;
  font-family:'BIZ UDPGothic',sans-serif;
  transition:all .12s;
}
.pg-btn:hover{border-color:var(--accent);color:var(--accent);}
.pg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.pg-btn:disabled{opacity:.3;cursor:not-allowed;}
.pg-info{font-size:11px;color:var(--muted);padding:0 4px;}

/* NEW badge */
.new-badge{
  background:#e8f4fd;color:#1a6fa8;
  border:1px solid #acd6f0;
  font-size:10px;font-weight:700;
  padding:1px 5px;border-radius:3px;
  margin-left:4px;
}

/* ===== MOBILE ===== */
@media(max-width:600px){
  /* Header */
  header{padding:0 12px;}
  .header-inner{gap:10px;padding:10px 0;}
  .yoko-logo{height:32px;}
  header h1{font-size:16px;}
  header .sub{font-size:10px;}
  .date-tag{display:none;}

  /* Container */
  .container{padding:10px;}

  /* Filter panel */
  .filter-panel{padding:14px;}
  .filter-row1{flex-direction:column;}
  /* 2行目：幅・扁平率を横並び2列 */
  .filter-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end;flex-wrap:wrap;}
  /* 内径・レス率は3行目として */
  .filter-row2-inner{grid-column:1;}
  .filter-row2-btn{grid-column:2;flex:0 0 auto;}
  .btn-group{width:100%;}
  .btn-search{flex:1;}
  .btn-reset{flex:0 0 auto;}

  /* Results meta */
  .results-meta{flex-direction:column;align-items:flex-start;gap:6px;}

  /* Table: brand column smaller on mobile */
  td.sticky-col{font-size:13px;min-width:110px;max-width:140px;}

  /* Pagination */
  .pagination{gap:4px;padding:10px;}
  .pg-btn{padding:5px 8px;font-size:12px;}
}
</style>
</head>

const PAGE = 50;
let cur = 1, filtered = [], sortCol = 7, sortDir = 1;

(function init(){
  const b = document.getElementById('brandSel');
  D.brands.forEach(v => {
    const o = document.createElement('option');
    o.value = o.textContent = v;
    b.appendChild(o);
  });
  const w = document.getElementById('widthSel');
  D.widths.forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    w.appendChild(o);
  });
  const f = document.getElementById('flatSel');
  D.flats.forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = (v === 0) ? '0 (バイアス等)' : String(v);
    f.appendChild(o);
  });
  const i = document.getElementById('innerSel');
  D.inners.forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    i.appendChild(o);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
})();

function fmt(n) {
  if (n === null || n === undefined || n === 'NEW') return null;
  return '¥' + Number(n).toLocaleString('ja-JP');
}

function doSearch() {
  const brand = document.getElementById('brandSel').value;
  const width = document.getElementById('widthSel').value;
  const flat  = document.getElementById('flatSel').value;
  const inner = document.getElementById('innerSel').value;

  filtered = D.r.filter(r => {
    if (brand && r[2] !== brand) return false;
    if (width !== '' && String(r[4]) !== String(width)) return false;
    if (flat  !== '' && String(r[5]) !== String(flat))  return false;
    if (inner !== '' && String(r[6]) !== String(inner)) return false;
    return true;
  });
  cur = 1; sortCol = 7; sortDir = 1;
  clearSort();
  render();
}

function resetSearch() {
  ['brandSel','widthSel','flatSel','innerSel'].forEach(id => {
    document.getElementById(id).value = '';
  });
  filtered = [];
  document.getElementById('resultCount').textContent = '検索条件を選択してください';
  document.getElementById('tbody').innerHTML =
    '<tr><td colspan="7"><div class="no-results"><div class="ico">🔍</div><p>検索条件を選択して「検索」ボタンを押してください</p></div></td></tr>';
  document.getElementById('pag').style.display = 'none';
  clearSort();
}

function sortBy(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = 1; }
  cur = 1; render();
}

function clearSort() {
  [0,1,2,7,9].forEach(c => {
    const el = document.getElementById('th' + c);
    if (el) el.className = (c === 2) ? 'sticky-col' : '';
  });
}

function render() {
  clearSort();
  const sortedId = ['th0','th1','th2','','','','','th7','','th9'][sortCol];
  if (sortedId) {
    const el = document.getElementById(sortedId.replace('th','th'));
    // simpler approach
  }
  const sortEl = document.getElementById('th' + sortCol);
  if (sortEl) sortEl.className = (sortEl.className.replace(' sort-asc','').replace(' sort-desc','').trim())
    + (sortCol === 2 ? ' sticky-col' : '') + (sortDir === 1 ? ' sort-asc' : ' sort-desc');

  const sorted = [...filtered].sort((a, b) => {
    let av = a[sortCol], bv = b[sortCol];
    if (av === null || av === undefined || av === 'NEW') av = sortDir > 0 ? Infinity : -Infinity;
    if (bv === null || bv === undefined || bv === 'NEW') bv = sortDir > 0 ? Infinity : -Infinity;
    if (typeof av === 'string' && typeof bv === 'string') return sortDir * av.localeCompare(bv, 'ja');
    return sortDir * ((av > bv) - (av < bv));
  });

  const total = sorted.length;
  const pages = Math.ceil(total / PAGE);
  const start = (cur - 1) * PAGE;
  const slice = sorted.slice(start, start + PAGE);

  document.getElementById('resultCount').innerHTML =
    '検索結果：<strong>' + total + '</strong> 件';

  const tbody = document.getElementById('tbody');
  if (total === 0) {
    tbody.innerHTML = '<tr><td colspan="7"><div class="no-results"><div class="ico">🚫</div><p>該当するタイヤが見つかりませんでした</p></div></td></tr>';
    document.getElementById('pag').style.display = 'none';
    return;
  }

  const rows = slice.map(r => {
    const [article, size, brand, hobby, width, flat, inner, priceNew, stockOnly, priceOld] = r;
    const isNew = priceOld === 'NEW' || priceOld === 0;
    const pnFmt = fmt(priceNew);

    // 仕切価格計算
    const lessRateVal = parseFloat(document.getElementById('lessRate').value);
    let shikiriHtml = '';
    if (!isNaN(lessRateVal) && lessRateVal > 0 && priceNew) {
      const raw = priceNew * (1 - lessRateVal / 100);
      const rounded = Math.round(raw / 100) * 100;
      shikiriHtml = '<span style="font-size:15px;font-weight:700;color:#1a6fa8;">¥' + rounded.toLocaleString('ja-JP') + '</span>';
    }

    const rowClass = hobby ? 'hobby-row' + (stockOnly ? ' stock-row' : '') : (stockOnly ? 'stock-row' : '');

    return '<tr class="' + rowClass + '">' +
      '<td class="sticky-col">' + brand + '</td>' +
      '<td class="size-cell">' + size + '</td>' +
      '<td style="text-align:center;">' + (hobby ? '<span class="flag-h">ホビー</span>' : '') + '</td>' +
      '<td class="art-cell">' + article + '</td>' +
      '<td class="price-new">' + pnFmt + '</td>' +
      '<td>' + shikiriHtml + '</td>' +
      '<td style="text-align:center;">' + (stockOnly ? '<span class="flag-s">在庫限</span>' : '') + (isNew ? '<span class="flag-new">NEW</span>' : '') + '</td>' +
      '</tr>';
  }).join('');

  tbody.innerHTML = rows;

  // pagination
  const pag = document.getElementById('pag');
  if (pages <= 1) { pag.style.display = 'none'; return; }
  pag.style.display = 'flex';

  let pagHtml = '<button class="pg-btn" onclick="goPage(' + (cur-1) + ')" ' + (cur<=1?'disabled':'') + '>‹</button>';
  const lo = Math.max(1, cur-2), hi = Math.min(pages, cur+2);
  if (lo > 1) pagHtml += '<button class="pg-btn" onclick="goPage(1)">1</button>' + (lo>2 ? '<span class="pg-info">…</span>':'');
  for (let p = lo; p <= hi; p++) {
    pagHtml += '<button class="pg-btn' + (p===cur?' active':'') + '" onclick="goPage(' + p + ')">' + p + '</button>';
  }
  if (hi < pages) pagHtml += (hi<pages-1?'<span class="pg-info">…</span>':'') + '<button class="pg-btn" onclick="goPage(' + pages + ')">' + pages + '</button>';
  pagHtml += '<button class="pg-btn" onclick="goPage(' + (cur+1) + ')" ' + (cur>=pages?'disabled':'') + '>›</button>';
  pagHtml += '<span class="pg-info">' + start + 1 + '–' + Math.min(start+PAGE, total) + ' / ' + total + '件</span>';
  pag.innerHTML = pagHtml;
}

function goPage(p) {
  cur = p;
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
